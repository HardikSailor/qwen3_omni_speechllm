  - {name: public_sg_speech_qa_test,      path: ab/public_sg_speech_qa_test,      task: SQA, metric: llama3_70b_judge}
  - {name: slue_p2_sqa5_test,             path: ab/slue_p2_sqa5_test,             task: SQA, metric: llama3_70b_judge}
  - {name: cn_college_listen_mcq_test,    path: ab/cn_college_listen_mcq_test,    task: SQA, metric: llama3_70b_judge}
  - {name: dream_tts_mcq_test,            path: ab/dream_tts_mcq_test,            task: SQA, metric: llama3_70b_judge}
  - {name: sqa_ytb_eval_human,            path: sea/SQA/test/sqa_ytb_eval_human_30, task: SQA, metric: llama3_70b_judge}
  - {name: cpqa_ytb_eval_human,           path: sea/PQA/test/cpqa_ytb_eval_human_30, task: SQA, metric: llama3_70b_judge}
  # ---------------- dialogue summary (judge)
  - {name: imda_part3_30s_ds_human_test,  path: ab/imda_part3_30s_ds_human_test,  task: SDS, metric: llama3_70b_judge}
  - {name: imda_part4_30s_ds_human_test,  path: ab/imda_part4_30s_ds_human_test,  task: SDS, metric: llama3_70b_judge}
  - {name: imda_part5_30s_ds_human_test,  path: ab/imda_part5_30s_ds_human_test,  task: SDS, metric: llama3_70b_judge}
  - {name: imda_part6_30s_ds_human_test,  path: ab/imda_part6_30s_ds_human_test,  task: SDS, metric: llama3_70b_judge}
  # ---------------- emotion, gender, accent (judge)
